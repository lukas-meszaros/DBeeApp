services:
  db_control:
    image: postgres:16.4
    container_name: dbeeapp-db-control
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbeeapp_control_admin_test_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./init/control.sql:/docker-entrypoint-initdb.d/10-control.sql:ro
      - control_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control"]
      interval: 2s
      timeout: 3s
      retries: 20

  db_reporting:
    image: postgres:16.4
    container_name: dbeeapp-db-reporting
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbeeapp_reporting_admin_test_only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./init/reporting.sql:/docker-entrypoint-initdb.d/10-reporting.sql:ro
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reporting"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  control_data:
  reporting_data:
