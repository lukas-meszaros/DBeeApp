version: 1
job:
  id: many_sequential_queries
  description: Benchmark sequential SQL operations over one reusable session
databases:
  reporting:
    host: 127.0.0.1
    port: 55433
    database: reporting
    user: reporting_user
    session: {mode: reuse}
    ssl: {mode: disable}
    credential:
      provider: dummy
      options: {password: dbeeapp_reporting_test_only}
