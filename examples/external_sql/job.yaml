version: 1
job:
  id: external_sql_csv
  description: Use a template-relative SQL file and write CSV output
variables:
  application: TEST_APP
databases:
  reporting:
    host: 127.0.0.1
    port: 55433
    database: reporting
    user: reporting_user
    ssl: {mode: disable}
    credential:
      provider: dummy
      options: {password: dbeeapp_reporting_test_only}
steps:
  - id: lookup
    type: sql
    db: reporting
    sql_file: sql/application_details.sql
    params:
      minimum_id: 1
      maximum_id: 300
    result: {mode: rows}
  - id: csv
    type: output
    source: lookup
    target: {type: file, path: /tmp/dbeeapp-application-details.csv}
    format: csv
    mode: overwrite
