version: 1
job:
  id: cross_database_status
  description: Control to reporting to control using both reusable sessions
variables:
  application: SAMPLE_APP_001
databases:
  control:
    host: 127.0.0.1
    port: 55432
    database: control
    user: control_user
    ssl: {mode: disable}
    credential:
      provider: dummy
      options: {password: dbeeapp_control_test_only}
  reporting:
    host: 127.0.0.1
    port: 55433
    database: reporting
    user: reporting_user
    ssl: {mode: disable}
    credential:
      provider: dummy
      options: {password: dbeeapp_reporting_test_only}
steps:
  - id: lookup_control
    type: sql
    db: control
    sql: SELECT application_id FROM control.applications WHERE application_name = :name
    params: {name: "{{ vars.application }}"}
    result: {mode: first}
    set: {application_id: "{{ steps.lookup_control.first.application_id }}"}
  - id: read_reporting
    type: sql
    db: reporting
    sql: SELECT status FROM reporting.application_status WHERE application_id = :id
    params: {id: "{{ vars.application_id }}"}
    result: {mode: first}
  - id: return_control
    type: sql
    db: control
    sql: SELECT application_name FROM control.applications WHERE application_id = :id
    params: {id: "{{ vars.application_id }}"}
    result: {mode: first}
  - id: report
    type: output
    source: read_reporting
    target: {type: stdout}
    format: json
