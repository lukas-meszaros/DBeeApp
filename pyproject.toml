[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dbeeapp"
version = "0.1.0"
description = "Declarative PostgreSQL workflow runner for secure and offline environments"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.13",
	"Operating System :: POSIX :: Linux",
]

[project.scripts]
dbeeapp = "dbeeapp.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dbeeapp", "dbeeapp._vendor", "dbeeapp._vendor.*"]
exclude = ["dbeeapp._vendor.*.__pycache__", "dbeeapp._vendor.*.*.__pycache__", "dbeeapp._vendor.*.*.*.__pycache__"]

[tool.setuptools.data-files]
"share/dbeeapp/providers" = ["providers/dummy.py", "providers/cyberark_aim.py"]

[tool.unittest]
start-directory = "tests"